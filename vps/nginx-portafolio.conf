# Sitio WordPress — portafolio.justcamm.online
# No toca otros server blocks (PM2 / texno / etc.)
# Instalar: sudo bash vps/setup-nginx-site.sh

server {
	listen 80;
	listen [::]:80;
	server_name portafolio.justcamm.online;

	root /var/www/justcamm;
	index index.php index.html;

	client_max_body_size 64M;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php8.4-fpm.sock;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include fastcgi_params;
	}

	location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff|woff2|mp4|webm|ico)$ {
		expires 30d;
		access_log off;
		try_files $uri =404;
	}

	location ~ /\. {
		deny all;
	}
}
